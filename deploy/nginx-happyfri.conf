# 复制到 ECS 后放到 /etc/nginx/sites-available/happyfri ，再 ln -s 到 sites-enabled 并 nginx -t && systemctl reload nginx
# 将 /opt/happyfri/dist 换成你实际上传 dist 的路径

server {
    listen 80;
    server_name _;   # 换成你的域名，例如 quiz.example.com

    root /opt/happyfri/dist;
    index index.html;

    # 题库文件上传
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
