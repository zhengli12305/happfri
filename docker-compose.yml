# 用法（在仓库根目录）：
#   docker compose build
#   docker compose up -d
# 浏览器访问：http://服务器公网IP/

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
